<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>倒计时布局 · 设计稿</title>
<style>*{box-sizing:border-box}body{margin:0;background:#EDF1E7;color:#213F32;font:15px/1.7 "Microsoft YaHei",sans-serif}.wrap{max-width:1120px;margin:48px auto;padding:0 24px}h1{font-size:28px;margin:0 0 6px}.intro{color:#51685A;margin:0 0 28px}.layout{display:grid;grid-template-columns:200px minmax(0,1fr);gap:28px}nav{display:flex;flex-direction:column;gap:8px}nav button{border:0;border-radius:8px;padding:12px 16px;color:#315C43;background:#FFFFFF;text-align:left;cursor:pointer;font:inherit}nav button.active{background:#315C43;color:white}.screen{width:100%;max-width:768px}.frame{position:relative;width:100%;aspect-ratio:4/3;box-shadow:0 8px 32px #213f3214;overflow:hidden;border-radius:12px}.frame img{width:100%;display:block;image-rendering:pixelated}.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;border-radius:8px}.hotspot:hover,.hotspot:focus-visible{outline:2px solid #6b946a;outline-offset:-3px;background:#315c430c}.note{color:#51685A;margin:18px 0;font-size:13px}.flow{border-top:1px solid #CCD6C7;margin-top:28px;padding-top:18px}.flow strong{font-weight:600}.flow p{margin:4px 0}@media(max-width:720px){.wrap{margin:24px auto;padding:0 16px}.layout{display:block}nav{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:18px}nav button{font-size:12px;padding:8px}h1{font-size:23px}.frame{border-radius:6px}}</style>
<main class="wrap"><h1>倒计时 · 页面布局重构</h1><p class="intro">设置时长进入独立页面，主页面留给常用计时器。</p><div class="layout"><nav><button onclick="show(0)" id="nav-0">01 主页面</button><button onclick="show(1)" id="nav-1">02 设置倒计时</button><button onclick="show(2)" id="nav-2">03 计时中</button><button onclick="show(3)" id="nav-3">04 已暂停</button><button onclick="show(4)" id="nav-4">05 提示音</button><button onclick="show(5)" id="nav-5">06 到时提醒</button></nav><div class="screen"><section class="frame" id="screen-0" aria-label="主页面" ><img src="01-home.png" alt="主页面设计稿"><button class="hotspot" style="left:3.75%;top:18.333333333333332%;width:92.5%;height:21.666666666666668%" aria-label="设置倒计时" title="设置倒计时" onclick="show(1)"></button><button class="hotspot" style="left:73.75%;top:0.8333333333333334%;width:22.5%;height:15.0%" aria-label="提示音" title="提示音" onclick="show(4)"></button><button class="hotspot" style="left:73.75%;top:41.66666666666667%;width:22.5%;height:12.5%" aria-label="添加常用计时器" title="添加常用计时器" onclick="show(1)"></button><button class="hotspot" style="left:3.75%;top:55.833333333333336%;width:92.5%;height:42.5%" aria-label="选择常用计时器" title="选择常用计时器" onclick="show(2)"></button></section><section class="frame" id="screen-1" aria-label="设置倒计时" hidden><img src="02-duration.png" alt="设置倒计时设计稿"><button class="hotspot" style="left:0.0%;top:0.0%;width:12.5%;height:16.666666666666664%" aria-label="返回" title="返回" onclick="show(0)"></button><button class="hotspot" style="left:46.25%;top:82.5%;width:50.0%;height:16.666666666666664%" aria-label="开始倒计时" title="开始倒计时" onclick="show(2)"></button></section><section class="frame" id="screen-2" aria-label="计时中" hidden><img src="03-running.png" alt="计时中设计稿"><button class="hotspot" style="left:0.0%;top:0.0%;width:12.5%;height:16.666666666666664%" aria-label="返回主页面" title="返回主页面" onclick="show(0)"></button><button class="hotspot" style="left:3.75%;top:82.5%;width:30.0%;height:16.666666666666664%" aria-label="重置" title="重置" onclick="show(0)"></button><button class="hotspot" style="left:36.25%;top:82.5%;width:60.0%;height:16.666666666666664%" aria-label="暂停" title="暂停" onclick="show(3)"></button></section><section class="frame" id="screen-3" aria-label="已暂停" hidden><img src="04-paused.png" alt="已暂停设计稿"><button class="hotspot" style="left:0.0%;top:0.0%;width:12.5%;height:16.666666666666664%" aria-label="返回主页面" title="返回主页面" onclick="show(0)"></button><button class="hotspot" style="left:3.75%;top:82.5%;width:30.0%;height:16.666666666666664%" aria-label="重置" title="重置" onclick="show(0)"></button><button class="hotspot" style="left:36.25%;top:82.5%;width:60.0%;height:16.666666666666664%" aria-label="继续" title="继续" onclick="show(2)"></button></section><section class="frame" id="screen-4" aria-label="提示音" hidden><img src="05-sounds.png" alt="提示音设计稿"><button class="hotspot" style="left:0.0%;top:0.0%;width:12.5%;height:16.666666666666664%" aria-label="返回" title="返回" onclick="show(0)"></button><button class="hotspot" style="left:3.75%;top:82.5%;width:92.5%;height:16.666666666666664%" aria-label="返回主页面" title="返回主页面" onclick="show(0)"></button></section><section class="frame" id="screen-5" aria-label="到时提醒" hidden><img src="06-finished.png" alt="到时提醒设计稿"><button class="hotspot" style="left:3.75%;top:82.5%;width:40.0%;height:16.666666666666664%" aria-label="停止提醒" title="停止提醒" onclick="show(0)"></button><button class="hotspot" style="left:46.25%;top:82.5%;width:50.0%;height:16.666666666666664%" aria-label="再来一次" title="再来一次" onclick="show(2)"></button></section><p class="note">320 × 240 原生 LVGL 设计稿。点击画面中的入口或左侧页签可预览页面；时间与常用项为演示内容。滚轮调整、存为常用和铃声试听在此原型中仅作展示。</p></div></div><div class="flow"><strong>页面路径</strong><p>设置倒计时 → 选择时 / 分 / 秒 → 开始倒计时</p><p>常用计时器 → 计时中 → 暂停 / 继续 → 到时提醒</p><p>提示音 → 选择已有铃声和音量 → 保存</p></div></main><script>function show(i){document.querySelectorAll('.frame').forEach((e,n)=>e.hidden=n!==i);document.querySelectorAll('nav button').forEach((e,n)=>e.classList.toggle('active',n===i));}show(0);</script></html>
